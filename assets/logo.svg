<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180">
  <rect width="640" height="180" rx="16" fill="#14171C"/>
  <!-- distribution color bars (Fedora blue, Ubuntu orange, Debian red, Kali green, Arch blue, SUSE green) -->
  <rect x="40" y="118" width="34" height="10" rx="3" fill="#3C6EB4"/>
  <rect x="80" y="118" width="34" height="10" rx="3" fill="#E95420"/>
  <rect x="120" y="118" width="34" height="10" rx="3" fill="#D70A53"/>
  <rect x="160" y="118" width="34" height="10" rx="3" fill="#16C60C"/>
  <rect x="200" y="118" width="34" height="10" rx="3" fill="#1793D1"/>
  <rect x="240" y="118" width="34" height="10" rx="3" fill="#73BA25"/>
  <!-- prompt motif -->
  <text x="40" y="66" font-family="monospace" font-size="34" font-weight="bold" fill="#E6E6E6">┌──(</text>
  <text x="216" y="66" font-family="monospace" font-size="34" font-weight="bold" fill="#E6E6E6">j0hn</text>
  <text x="296" y="66" font-family="monospace" font-size="34" font-weight="bold" fill="#3C6EB4">◉</text>
  <text x="330" y="66" font-family="monospace" font-size="34" font-weight="bold" fill="#3C6EB4">fedora</text>
  <text x="452" y="66" font-family="monospace" font-size="34" font-weight="bold" fill="#3C6EB4">)-[</text>
  <text x="536" y="66" font-family="monospace" font-size="34" font-weight="bold" fill="#66CCCC">~/</text>
  <text x="40" y="104" font-family="monospace" font-size="34" font-weight="bold" fill="#3C6EB4">└─</text>
  <text x="100" y="104" font-family="monospace" font-size="34" font-weight="bold" fill="#E6E6E6">$</text>
  <!-- wordmark -->
  <text x="40" y="154" font-family="monospace" font-size="22" font-weight="bold" fill="#FFFFFF">DistroZSH</text>
  <text x="160" y="154" font-family="monospace" font-size="16" fill="#9AA4AE">framework-free · cross-distribution · native ZSH</text>
</svg>
